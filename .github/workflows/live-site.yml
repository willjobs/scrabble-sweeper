name: Check published site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/live-site.yml]
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify HTTPS page, bundle, manifest and icons
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const address='https://willjobs.com/scrabble-sweeper/';
          async function get(url){
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,`${url}: HTTP ${response.status}`);
            assert.equal(new URL(response.url).protocol,'https:',`${url}: redirected away from HTTPS`);
            console.log(`OK ${response.url}`);
            return response;
          }
          const page=await get(address),html=await page.text();
          assert.match(html,/<title>Veiled Words<\/title>/);
          const script=html.match(/<script[^>]+src="([^"]*\/assets\/[^" ]+\.js)"/);
          assert.ok(script,'Missing application bundle');
          const bundle=await get(new URL(script[1],address));
          assert.match(bundle.headers.get('content-type')||'',/javascript/);
          const manifestUrl=new URL('manifest.webmanifest',address);
          const manifest=await (await get(manifestUrl)).json();
          assert.equal(manifest.start_url,'/scrabble-sweeper/');
          assert.equal(manifest.scope,'/scrabble-sweeper/');
          for(const icon of manifest.icons)await get(new URL(icon.src,manifestUrl));
          await get(new URL('sw.js',address));
          console.log(`Published site verified: ${address}`);
          JS
