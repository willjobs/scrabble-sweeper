name: Check published site
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
permissions:
  contents: read
  pages: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify published HTML and rendered gameplay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-published-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-site-browser-checks
          path: test-results/live
          retention-days: 7
