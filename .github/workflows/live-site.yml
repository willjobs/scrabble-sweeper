name: Check published site
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
permissions:
  contents: read
  pages: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify HTTPS page, bundle, manifest and icons
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const settings=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`,{
            headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json'},
            signal:AbortSignal.timeout(30000)
          });
          assert.equal(settings.status,200,'Unable to read GitHub Pages configuration');
          const {html_url:address}=await settings.json();
          assert.ok(address,'Missing GitHub Pages URL');
          async function get(url){
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,`${url}: HTTP ${response.status}`);
            assert.equal(new URL(response.url).protocol,'https:',`${url}: redirected away from HTTPS`);
            console.log(`OK ${response.url}`);
            return response;
          }
          const page=await get(address),html=await page.text();
          const published=page.url,base=new URL(published).pathname;
          assert.match(html,/<title>Tile Theory<\/title>/);
          const script=html.match(/<script[^>]+src="([^"]*\/assets\/[^" ]+\.js)"/);
          assert.ok(script,'Missing application bundle');
          const bundle=await get(new URL(script[1],published));
          assert.match(bundle.headers.get('content-type')||'',/javascript/);
          const manifestUrl=new URL('manifest.webmanifest',published);
          const manifest=await (await get(manifestUrl)).json();
          assert.equal(manifest.start_url,base);
          assert.equal(manifest.scope,base);
          for(const icon of manifest.icons)await get(new URL(icon.src,manifestUrl));
          await get(new URL('sw.js',published));
          console.log(`Published site verified: ${published}`);
          JS
